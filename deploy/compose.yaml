name: meal-prep
services:
  web:
    image: meal-prep-web:${MEAL_WEB_RELEASE:?set immutable Web release tag}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    environment:
      MEAL_DB_PATH: /var/lib/meal-prep/plan.sqlite3
      MEAL_API_ORIGIN: http://api:14318
      MEAL_PUBLIC_ORIGIN: https://meal-prep-agent.fathompod.workers.dev
    volumes:
      - type: bind
        source: ./data
        target: /var/lib/meal-prep
        bind: {create_host_path: false}
    networks: [private]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:14319/api/internal/storage-health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  api:
    image: meal-prep-api:${MEAL_RELEASE:?set immutable release tag}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ./secrets/api.env
    networks: [private]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:14318/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  tunnel:
    image: cloudflare/cloudflared:2026.9.0@sha256:ff69a2225ad7c6f85ed84fbd5f3087df46202426b2388ec60214098e0adf05e9
    command: [tunnel, --no-autoupdate, --protocol, quic, run, --token-file, /run/secrets/tunnel_token]
    secrets: [tunnel_token]
    networks: [private]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  private: {}
secrets:
  tunnel_token:
    file: ./secrets/tunnel-token
